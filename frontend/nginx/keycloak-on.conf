# The bundled Keycloak (ADR-017 D-17.6), served under /keycloak so the kind demo needs one
# port-forward. An ALLOWLIST: theme assets and the `topology` realm's sign-in endpoints are
# proxied; everything else under /keycloak — the admin console and REST API, the master realm —
# is 404, with or without a session. Every location here says `auth_request off`: the sign-in
# pages must be reachable before there is a session, and a 404 must not become a sign-in redirect.
#
# `^~` prefixes: the longest one wins and regex locations are skipped, so each refusal below takes
# precedence over the realm prefix it sits under. The realm name matches the chart's
# topology.keycloakRealm.

location ^~ /keycloak/ {
    auth_request off;
    return 404;
}

location ^~ /keycloak/resources/ {
    include /etc/nginx/snippets/keycloak-proxy.conf;
}

location ^~ /keycloak/realms/topology/ {
    include /etc/nginx/snippets/keycloak-proxy.conf;
}

# Inside the realm, refused: the self-service account console (a user's password lives in values,
# and a restart would discard any change); dynamic client registration; the device and CIBA
# grants (also disabled per client and at build time — a third layer); SAML, which no client uses;
# token introspection, which nothing here calls.
location ^~ /keycloak/realms/topology/account {
    auth_request off;
    return 404;
}
location ^~ /keycloak/realms/topology/clients-registrations {
    auth_request off;
    return 404;
}
location ^~ /keycloak/realms/topology/protocol/openid-connect/auth/device {
    auth_request off;
    return 404;
}
location ^~ /keycloak/realms/topology/protocol/openid-connect/ext/ {
    auth_request off;
    return 404;
}
location ^~ /keycloak/realms/topology/protocol/openid-connect/token/introspect {
    auth_request off;
    return 404;
}
location ^~ /keycloak/realms/topology/protocol/saml {
    auth_request off;
    return 404;
}
