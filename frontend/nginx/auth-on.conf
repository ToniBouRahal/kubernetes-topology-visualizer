# Sign-in (ADR-014 D-14.6): every request is checked with the oauth2-proxy sidecar first.
# Included at server level when AUTH_MODE=on. Locations that must stay reachable without a
# session — the sign-in flow itself, the bundled Dex, the pod's own liveness — say `auth_request off`.

auth_request /oauth2/auth;
# The signed-in user's address, forwarded to the backend for its request log (the /api/ location).
auth_request_set $auth_email $upstream_http_x_auth_request_email;
# A page with no session goes to sign-in and comes back to the same path.
error_page 401 = @signin;

location = /oauth2/auth {
    internal;
    proxy_pass http://127.0.0.1:4180;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Original-URI $request_uri;
}

# /oauth2/start, /oauth2/callback, /oauth2/sign_out.
location /oauth2/ {
    auth_request off;
    proxy_pass http://127.0.0.1:4180;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Uri $request_uri;
    include /etc/nginx/snippets/security-headers.conf;
}

location @signin {
    # $uri, not $request_uri: the query string would need URL-encoding to travel inside rd, and
    # nginx has no encoder. The UI keeps its state in memory, so the path is what matters.
    return 302 /oauth2/start?rd=$uri;
}
