# Browser security headers (ADR-014 D-14.10). Included at server level AND inside every location
# that sets its own add_header: nginx drops the server-level add_header set entirely in any
# location that declares one, so a header set only once would silently vanish from index.html.
#
# style-src allows 'unsafe-inline' because React Flow positions every node and edge with an inline
# style attribute; scripts get no such allowance. form-action 'self' covers the sign-in forms,
# which are served from this origin (Dex under /dex, oauth2-proxy under /oauth2).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
