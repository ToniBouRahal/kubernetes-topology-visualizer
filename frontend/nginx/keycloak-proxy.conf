# Proxying to the bundled Keycloak (ADR-017 D-17.6), shared by the two locations keycloak-on.conf
# lets through. Over TLS, Keycloak's certificate verified against the server CA by its Service name.
auth_request off;
include /etc/nginx/snippets/security-headers-keycloak.conf;
# Keycloak sends its own CSP and framing headers; a second CSP would be intersected with ours, so
# the browser applies exactly the one in security-headers-keycloak.conf (D-17.7).
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_pass $keycloak_upstream;
proxy_ssl_trusted_certificate /etc/nginx/tls/ca.crt;
proxy_ssl_verify on;
proxy_ssl_verify_depth 2;
proxy_ssl_name $keycloak_host;
proxy_ssl_server_name on;
proxy_ssl_protocols TLSv1.3;
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-For $remote_addr;
# Sign-in responses carry several large cookies; nginx's default 4k header buffer refuses them
# ("upstream sent too big header") as a 502.
proxy_buffer_size 16k;
proxy_buffers 8 16k;
