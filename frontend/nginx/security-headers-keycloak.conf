# Browser security headers for the bundled Keycloak's pages (ADR-017 D-17.7, amending ADR-014
# D-14.10 as ADR-015 D-15.8 did for Dex). Starts from security-headers-dex.conf: form-action also
# names the CLI's three loopback callback origins, because Keycloak answers the password POST with
# a redirect to the client's redirect_uri and Chromium applies form-action to that redirect.
# Anything else Keycloak's login theme is measured to need is added here, with its reason.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' http://127.0.0.1:38085 http://127.0.0.1:38086 http://127.0.0.1:38087; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
