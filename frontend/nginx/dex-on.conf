# The bundled Dex (ADR-014 D-14.7), served under /dex so the kind demo needs one port-forward.
# Its pages are the sign-in itself, so they are reachable without a session.
location /dex/ {
    auth_request off;
    # Dex's own CSP: form-action also admits the CLI's loopback callbacks (ADR-015 D-15.8).
    include /etc/nginx/snippets/security-headers-dex.conf;
    # Over TLS, Dex's certificate verified against the server CA by its Service name (ADR-014).
    proxy_pass $dex_upstream;
    proxy_ssl_trusted_certificate /etc/nginx/tls/ca.crt;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;
    proxy_ssl_name $dex_host;
    proxy_ssl_server_name on;
    proxy_ssl_protocols TLSv1.3;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
}

# Dex's device flow, closed (ADR-015 D-15.6): /device, /device/code, /device/token,
# /device/callback and /device/auth/verify_code. Dex v2.45.1 registers them whatever
# oauth2.grantTypes says, and with a public client they would issue bearer-valid tokens to anyone
# who talks a user into approving a code. The chart never uses them. The longest prefix wins and
# ^~ skips regex locations, so every path under /dex/device ends here; auth_request off so the
# answer is a 404 with or without a session, never a sign-in redirect.
location ^~ /dex/device {
    auth_request off;
    return 404;
}
