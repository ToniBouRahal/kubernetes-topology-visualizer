[project]
name = "topology-backend"
version = "0.1.0"
description = "Ingestion, graph, and diff API for the Kubernetes runtime topology visualizer"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118",
    "pydantic>=2.11",
    "pydantic-settings>=2.7",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx2>=0.29",
    "ruff>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DTZ"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
