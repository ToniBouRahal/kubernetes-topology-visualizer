{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "topology.fullname" . }}-frontend
  labels:
    {{- include "topology.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "topology.frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "topology.frontend.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.frontend.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.service.port }}
          # Templated from the same helper that names the Service. The image carries a default,
          # but relying on it couples the frontend to one release name — and a stale default
          # fails at nginx start-up with "host not found in upstream", not at request time.
          env:
            - name: BACKEND_HOST
              value: {{ include "topology.backendService" . | quote }}
            - name: BACKEND_PORT
              value: {{ .Values.backend.service.port | quote }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          # readOnlyRootFilesystem stays on (ADR-001 §6). nginx renders its config template at
          # start-up and needs scratch space, so the few paths it writes are emptyDir rather than
          # the whole filesystem being made writable.
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-conf
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
{{- end }}
