{{- if and .Values.postgresql.enabled (eq .Values.postgresql.mode "internal") (not .Values.postgresql.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "topology.fullname" . }}-db
  labels:
    {{- include "topology.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Never committed in a values file. Supplied via --set or an existing Secret; values.schema.json
  # rejects an empty password when an in-cluster database is enabled (ADR-005 D-5.7).
  password: {{ required "postgresql.auth.password is required when postgresql.enabled=true — supply it with --set or use postgresql.auth.existingSecret" .Values.postgresql.auth.password | quote }}
  # Fully qualified: the backend resolves this through cluster DNS, and a bare name would
  # depend on the search path being what we expect.
  #
  # verify-full: TLS, the certificate signed by the server CA, AND issued for this name — the
  # database only accepts TLS anyway (ADR-014 D-14.8), and this refuses an impostor that has one.
  database-url: {{ printf "postgresql://%s:%s@%s-postgresql.%s.svc.cluster.local:%d/%s?sslmode=verify-full&sslrootcert=/etc/topology/tls/server/ca.crt" .Values.postgresql.auth.username .Values.postgresql.auth.password (include "topology.fullname" .) .Release.Namespace (int .Values.postgresql.service.port) .Values.postgresql.auth.database | quote }}
{{- end }}
{{- $alerts := .Values.alerts }}
{{- if and $alerts.enabled (not $alerts.existingSecret) (or $alerts.slack.webhookUrl $alerts.teams.webhookUrl $alerts.telegram.botToken) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "topology.alertsSecret" . }}
  labels:
    {{- include "topology.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  # Chat-alert credentials (ADR-018 D-18.2). A webhook URL is a credential: anyone holding it can
  # post to the channel. Supplied with --set, never committed.
  {{- with $alerts.slack.webhookUrl }}
  slack-webhook-url: {{ . | quote }}
  {{- end }}
  {{- with $alerts.teams.webhookUrl }}
  teams-webhook-url: {{ . | quote }}
  {{- end }}
  {{- with $alerts.telegram.botToken }}
  telegram-bot-token: {{ . | quote }}
  {{- end }}
{{- end }}
