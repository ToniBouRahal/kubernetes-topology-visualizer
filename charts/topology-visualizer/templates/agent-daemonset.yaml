{{- if .Values.agent.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "topology.fullname" . }}-agent
  labels:
    {{- include "topology.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      {{- include "topology.agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pods when the ConfigMap changes.
        #
        # envFrom reads a ConfigMap at container START, so without this a value change applies to
        # nothing: `helm upgrade` reports success, the ConfigMap holds the new value, and the
        # running pod keeps serving the old one indefinitely. That is how a retention change from
        # 24 to 1440 hours was observed to take effect nowhere at all.
        checksum/config: {{ include (print $.Template.BasePath "/configmaps.yaml") . | sha256sum }}
        {{- if .Values.tls.generate }}
        checksum/tls: {{ include "topology.pkiChecksum" (dict "root" . "role" "agent") }}
        {{- end }}
        {{- if .Values.observability.enabled }}
        # The bundled Prometheus has no operator and discovers targets by annotation (ADR-013
        # D-13.2). Absent otherwise, so the default render is unchanged. T-13.3 asserts this port
        # is the same one the `metrics` containerPort below declares.
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.agent.metricsPort | quote }}
        prometheus.io/path: /metrics
        {{- end }}
      labels:
        {{- include "topology.agent.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "topology.serviceAccountName" . }}
      # Runs on every node, control-plane included. Without this the three-node validation
      # in Phase 1 and Phase 5 silently under-reports.
      tolerations:
        {{- toYaml .Values.agent.tolerations | nindent 8 }}
      containers:
        - name: agent
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          securityContext:
            {{- if .Values.agent.privileged }}
            # Escape hatch only, for a kernel without CAP_BPF (before 5.8, outside ADR-002's
            # support range). Everything below is what a supported kernel needs instead.
            privileged: true
            {{- else }}
            # Two capabilities, not privilege (ADR-014 D-14.9). Measured on kernel 6.8: BPF loads
            # the program and creates the ring buffer; PERFMON attaches it to the tracepoint and
            # lets it read kernel socket state. Nothing else was needed — memlock is not raised
            # (BPF memory is cgroup-accounted since 5.11), no hostPID, no BPF filesystem, and the
            # runtime's default seccomp profile admits bpf() and perf_event_open() for exactly
            # these capabilities. uid 0 because a capability is only effective for root inside
            # the container; with everything else dropped, root holds exactly these two.
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 0
            runAsNonRoot: false
            capabilities:
              drop: ["ALL"]
              add: ["BPF", "PERFMON"]
            seccompProfile:
              type: RuntimeDefault
            {{- end }}
          ports:
            - name: health
              containerPort: {{ .Values.agent.healthPort }}
            - name: metrics
              containerPort: {{ .Values.agent.metricsPort }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CLUSTER_ID
              value: {{ .Values.clusterId | quote }}
            - name: BACKEND_INGEST_URL
              value: {{ include "topology.backendIngestUrl" . | quote }}
            # Mutual TLS to the ingest listener (ADR-014 D-14.4): the agent's own certificate,
            # and the server CA it verifies the backend with.
            - name: AGENT_TLS_CERT_FILE
              value: /etc/topology/tls/agent/tls.crt
            - name: AGENT_TLS_KEY_FILE
              value: /etc/topology/tls/agent/tls.key
            - name: AGENT_TLS_CA_FILE
              value: /etc/topology/tls/agent/ca.crt
            - name: AGENT_FLUSH_INTERVAL_SECONDS
              value: {{ .Values.agent.flushIntervalSeconds | quote }}
            - name: AGENT_MAX_PENDING_BATCHES
              value: {{ .Values.agent.maxPendingBatches | quote }}
            - name: INFRASTRUCTURE_PORTS
              value: {{ .Values.agent.infrastructurePorts | quote }}
            - name: AGENT_DEBUG_RAW_EVENTS
              value: {{ .Values.agent.debugRawEvents | quote }}
            - name: AGENT_METRICS_PORT
              value: {{ .Values.agent.metricsPort | quote }}
            - name: AGENT_HEALTH_PORT
              value: {{ .Values.agent.healthPort | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            # Ready only after informer cache sync and BPF attach (ADR-002 D-2.7).
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
          volumeMounts:
            - name: tls-agent
              mountPath: /etc/topology/tls/agent
              readOnly: true
            # Read-only: only the tracepoint's id is read here, to attach the program.
            - name: tracefs
              mountPath: /sys/kernel/tracing
              readOnly: true
      volumes:
        - name: tls-agent
          secret:
            secretName: {{ include "topology.fullname" . }}-tls-agent
            defaultMode: 0400
        - name: tracefs
          hostPath:
            path: /sys/kernel/tracing
            type: Directory
{{- end }}
