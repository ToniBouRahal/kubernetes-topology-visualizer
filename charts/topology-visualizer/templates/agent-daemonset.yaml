{{- if .Values.agent.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "topology.fullname" . }}-agent
  labels:
    {{- include "topology.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      {{- include "topology.agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "topology.agent.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "topology.serviceAccountName" . }}
      hostPID: {{ .Values.agent.hostPID }}
      # Runs on every node, control-plane included. Without this the three-node validation
      # in Phase 1 and Phase 5 silently under-reports.
      tolerations:
        {{- toYaml .Values.agent.tolerations | nindent 8 }}
      containers:
        - name: agent
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          securityContext:
            # THE ONE PRIVILEGED WORKLOAD, and the asymmetry D-7.4 requires spelling out.
            #
            # Loading a BPF program and attaching it to a tracepoint needs CAP_BPF and
            # CAP_PERFMON (CAP_SYS_ADMIN on older kernels), plus a raised memlock limit. There is
            # no configuration of a non-privileged container that can do this — the capability is
            # the feature.
            #
            # Deliberately NOT given seccompProfile: RuntimeDefault, unlike every other workload
            # here. The default profile restricts bpf() and perf_event_open(), which are precisely
            # the syscalls this agent exists to make; applying it would break capture at start-up.
            #
            # What limits the blast radius instead: the container is read-only in effect (it opens
            # no files for writing), its RBAC is get/list/watch only (agent-rbac.yaml), it never
            # reads packet payloads (ADR-001 §6), and it holds no database credentials. The
            # privilege buys kernel-level *observation*, not cluster-level authority.
            privileged: {{ .Values.agent.privileged }}
          ports:
            - name: health
              containerPort: {{ .Values.agent.healthPort }}
            - name: metrics
              containerPort: {{ .Values.agent.metricsPort }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CLUSTER_ID
              value: {{ .Values.clusterId | quote }}
            - name: BACKEND_INGEST_URL
              value: {{ include "topology.backendIngestUrl" . | quote }}
            - name: AGENT_FLUSH_INTERVAL_SECONDS
              value: {{ .Values.agent.flushIntervalSeconds | quote }}
            - name: AGENT_MAX_PENDING_BATCHES
              value: {{ .Values.agent.maxPendingBatches | quote }}
            - name: INFRASTRUCTURE_PORTS
              value: {{ .Values.agent.infrastructurePorts | quote }}
            - name: AGENT_DEBUG_RAW_EVENTS
              value: {{ .Values.agent.debugRawEvents | quote }}
            - name: AGENT_METRICS_PORT
              value: {{ .Values.agent.metricsPort | quote }}
            - name: AGENT_HEALTH_PORT
              value: {{ .Values.agent.healthPort | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            # Ready only after informer cache sync and BPF attach (ADR-002 D-2.7).
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
          volumeMounts:
            - name: bpffs
              mountPath: /sys/fs/bpf
            - name: debugfs
              mountPath: /sys/kernel/debug
      volumes:
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
            type: Directory
{{- end }}
