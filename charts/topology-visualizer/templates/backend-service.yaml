{{- if .Values.backend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "topology.backendService" . }}
  labels:
    {{- include "topology.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  {{- if .Values.observability.enabled }}
  # Scraped by the bundled Prometheus's service-endpoints job (ADR-013 D-13.2) on the plain ops
  # port, which serves /metrics and /health only — never topology (ADR-014 D-14.3).
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: {{ .Values.backend.service.port | quote }}
    prometheus.io/path: /metrics
  {{- end }}
spec:
  # ClusterIP only: ingestion is never exposed outside the cluster by default (ADR-001 §6).
  type: {{ .Values.backend.service.type }}
  ports:
    # ops: /health/*, /metrics. Keeps the name "http" that the ServiceMonitor scrapes by.
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
    # Mutual TLS (ADR-014 D-14.3): agents only, then the frontend only.
    - name: ingest
      port: {{ .Values.backend.service.ingestPort }}
      targetPort: ingest
    - name: api
      port: {{ .Values.backend.service.apiPort }}
      targetPort: api
  selector:
    {{- include "topology.backend.selectorLabels" . | nindent 4 }}
{{- end }}
