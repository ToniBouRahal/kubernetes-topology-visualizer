{{- if and .Values.postgresql.enabled (eq .Values.postgresql.mode "internal") }}
{{- $fullname := include "topology.fullname" . -}}
{{- $secret := .Values.postgresql.auth.existingSecret | default (printf "%s-db" $fullname) -}}
# In-chart StatefulSet against the pinned upstream postgres image, rather than a third-party
# subchart (ADR-007 D-7.2). The schema is three tables and the adapter is hand-written, so a
# subchart would add a dependency and a distribution-policy risk without adding anything the
# demo needs. An external database is still supported via postgresql.mode=external.
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-postgresql
  labels:
    {{- include "topology.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  # Headless: a StatefulSet of one, addressed by its stable name. Nothing outside the cluster
  # ever reaches this, and the backend is the only client.
  clusterIP: None
  ports:
    - name: postgresql
      port: {{ .Values.postgresql.service.port }}
      targetPort: postgresql
  selector:
    {{- include "topology.postgresql.selectorLabels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-postgresql
  labels:
    {{- include "topology.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  serviceName: {{ $fullname }}-postgresql
  replicas: 1
  selector:
    matchLabels:
      {{- include "topology.postgresql.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/hba: {{ include "topology.postgresql.hba" . | sha256sum }}
        {{- if .Values.tls.generate }}
        checksum/tls: {{ include "topology.pkiChecksum" (dict "root" . "role" "postgresql") }}
        {{- end }}
      labels:
        {{- include "topology.postgresql.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        # The postgres image needs to own its data directory; fsGroup makes the mounted volume
        # writable by the postgres user without running the container as root.
        fsGroup: 999
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}{{ with .Values.postgresql.image.digest }}@{{ . }}{{ end }}"
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # NOT read-only, unlike the backend and frontend: postgres writes its socket to
            # /var/run/postgresql and its configuration into PGDATA at initdb time. Making this
            # read-only would need two more emptyDirs for a database that is a demo convenience,
            # so the honest posture is a writable rootfs with everything else dropped.
            readOnlyRootFilesystem: false
          # TLS 1.3 with a server-CA certificate, and a host-based-auth file that refuses any TCP
          # connection that is not TLS (ADR-014 D-14.8). Passed as server options so they also
          # apply to the image's temporary server during first-time initialisation.
          args:
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/etc/postgresql/tls/tls.crt
            - -c
            - ssl_key_file=/etc/postgresql/tls/tls.key
            - -c
            - ssl_min_protocol_version=TLSv1.3
            - -c
            - hba_file=/etc/postgresql/hba/pg_hba.conf
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: password
            # The image initialises into a subdirectory so the volume's lost+found does not make
            # the data directory look non-empty.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.auth.username | quote }}, "-d", {{ .Values.postgresql.auth.database | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.auth.username | quote }}]
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: tls
              mountPath: /etc/postgresql/tls
              readOnly: true
            - name: hba
              mountPath: /etc/postgresql/hba
              readOnly: true
      volumes:
        # PostgreSQL accepts a key owned by root only when it is not group-writable or
        # world-accessible: 0440 with the postgres group from fsGroup satisfies that.
        - name: tls
          secret:
            secretName: {{ $fullname }}-tls-postgresql
            defaultMode: 0440
            items:
              - { key: tls.crt, path: tls.crt }
              - { key: tls.key, path: tls.key }
        - name: hba
          configMap:
            name: {{ $fullname }}-postgresql-hba
        {{- if not .Values.postgresql.persistence.enabled }}
        - name: data
          # Explicitly non-durable. Only for a throwaway run; the chart's default is a PVC.
          emptyDir: {}
        {{- end }}
{{- if .Values.postgresql.persistence.enabled }}
  # volumeClaimTemplates, NOT an emptyDir. This is what makes history survive pod deletion,
  # which Phase 3 and Phase 5 both gate on (T-5.10, T-7.8).
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgresql.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size | quote }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-postgresql-hba
  labels:
    {{- include "topology.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
data:
  pg_hba.conf: |
    {{- include "topology.postgresql.hba" . | nindent 4 }}
{{- end }}
