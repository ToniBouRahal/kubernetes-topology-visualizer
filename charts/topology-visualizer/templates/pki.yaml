{{- /*
Certificates for mutual TLS between every component (ADR-014 D-14.2). Generated by the chart and
persisted across upgrades; see "topology.pki" in _helpers.tpl for why no CA key is stored.

With tls.generate=false the chart renders none of these and expects Secrets of the same names
and keys to exist already — for example issued by cert-manager.
*/ -}}
{{- if .Values.tls.generate }}
{{- include "topology.pki" . }}
{{- $pki := .Values.__pki }}
{{- $full := include "topology.fullname" . }}
{{- range $role := list "server" "postgresql" "agent" "frontend" "dex" }}
{{- $leaf := index $pki $role }}
---
apiVersion: v1
kind: Secret
metadata:
  {{- /* Dex's is a fixed name: its subchart mounts it from values, which cannot be templated. */}}
  name: {{ ternary "topology-dex-tls" (printf "%s-tls-%s" $full $role) (eq $role "dex") }}
  labels:
    {{- include "topology.labels" $ | nindent 4 }}
    app.kubernetes.io/component: pki
type: kubernetes.io/tls
data:
  tls.crt: {{ $leaf.crt | b64enc | quote }}
  tls.key: {{ $leaf.key | b64enc | quote }}
  ca.crt: {{ $leaf.ca | b64enc | quote }}
{{- end }}
---
# The two client CAs, public certificates only: what the backend's mTLS listeners trust.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $full }}-tls-client-cas
  labels:
    {{- include "topology.labels" . | nindent 4 }}
    app.kubernetes.io/component: pki
type: Opaque
data:
  ingest-ca.crt: {{ $pki.clientCAs.ingest | b64enc | quote }}
  api-ca.crt: {{ $pki.clientCAs.api | b64enc | quote }}
{{- end }}
