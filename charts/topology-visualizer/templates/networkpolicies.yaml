{{- if .Values.networkPolicy.enabled }}
# NOTE: kind's default CNI does NOT enforce NetworkPolicy. These are shipped for correctness on
# real clusters and for the kubeadm validation; the limitation is stated in docs/limitations.md
# rather than implying protection that is not there (ADR-007 D-7.4).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "topology.fullname" . }}-backend
  labels:
    {{- include "topology.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "topology.backend.selectorLabels" . | nindent 6 }}
  # Ingress only. Restricting egress as well would need explicit DNS and API-server rules, and a
  # half-correct egress policy that silently breaks name resolution is worse than none.
  policyTypes: [Ingress]
  ingress:
    # One client per listener (ADR-014 D-14.3). mTLS already refuses the wrong certificate on
    # each; this refuses the connection before a handshake is even attempted.
    # Agents: the ingest listener only.
    - from:
        - podSelector:
            matchLabels:
              {{- include "topology.agent.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.backend.service.ingestPort }}
    # The frontend: the API listener for reads, and the ops listener for its /health proxy.
    - from:
        - podSelector:
            matchLabels:
              {{- include "topology.frontend.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.backend.service.apiPort }}
        - protocol: TCP
          port: {{ .Values.backend.service.port }}
{{- if .Values.monitoring.enabled }}
    # ADR-011 D-11.5. Prometheus lives in another namespace, so with the rule above alone, enabling
    # monitoring under an enforcing CNI produces a target that reads `up == 0` and nothing else.
    # Admitted from ONE namespace (optionally narrowed to specific pods), on the backend port only.
    # The agent carries no NetworkPolicy and needs no rule.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.monitoring.prometheusNamespace | quote }}
          {{- with .Values.monitoring.prometheusPodSelector }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.backend.service.port }}
{{- end }}
{{- if .Values.observability.enabled }}
    # ADR-013 D-13.7. The bundled Prometheus runs in THIS namespace, so the cross-namespace rule
    # above would not cover it. Admitted by the Prometheus chart's own server labels, on the
    # backend port only.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              app.kubernetes.io/component: server
      ports:
        - protocol: TCP
          port: {{ .Values.backend.service.port }}
{{- end }}
{{- if .Values.postgresql.enabled }}
---
# The other half of D-7.4: the database accepts connections only from the backend.
#
# Without this, any pod in the namespace can reach PostgreSQL on 5432 and read the full observed
# topology — which is exactly the sensitive artefact this system produces. The backend is the only
# component that holds the credentials, so it should be the only component that can even open the
# socket.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "topology.fullname" . }}-postgresql
  labels:
    {{- include "topology.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "topology.postgresql.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "topology.backend.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
{{- if and .Values.auth.enabled .Values.auth.dex.enabled }}
---
# The bundled Dex (ADR-014 D-14.7): its HTTPS port, from the frontend pods only — nginx for the
# browser's sign-in pages, oauth2-proxy for the token exchange. Its chart also always opens plain
# HTTP on 5556, which this leaves unreachable. Probes use the telemetry port, which kubelet
# reaches regardless of policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "topology.fullname" . }}-dex
  labels:
    {{- include "topology.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dex
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "topology.frontend.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5554
{{- end }}
{{- end }}
