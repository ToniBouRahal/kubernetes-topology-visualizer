{{- /*
Sign-in secrets and the bundled Dex's configuration (ADR-014 D-14.6, D-14.7). The bundled
Keycloak's realm is in keycloak.yaml (ADR-017).

<fullname>-auth holds what the chart generates: the session-cookie key, and with a bundled
provider its client secret and the demo user's password — plus, for Dex, that password's bcrypt
hash (Keycloak hashes it itself on import). All are generated once and kept across upgrades
("topology.authSecrets" in _helpers.tpl), so an upgrade does not sign everyone out or change the
demo password.
*/ -}}
{{- if .Values.auth.enabled }}
{{- $full := include "topology.fullname" . }}
{{- include "topology.authSecrets" . }}
{{- $cookie := .Values.__authSecrets.cookie }}
{{- $clientSecret := .Values.__authSecrets.client }}
{{- $password := .Values.__authSecrets.password }}
{{- $hash := .Values.__authSecrets.hash }}
{{- if not .Values.auth.externalUrl }}
{{- fail "auth.externalUrl is required when auth.enabled: the URL people open the UI at, e.g. https://topology.example.com" }}
{{- end }}
{{- $bundled := or .Values.auth.dex.enabled .Values.auth.keycloak.enabled }}
{{- if and (not $bundled) (or (not .Values.auth.oidc.issuerUrl) (not .Values.auth.oidc.clientId) (not .Values.auth.oidc.clientSecret.existingSecret)) }}
{{- fail "auth.oidc.issuerUrl, auth.oidc.clientId and auth.oidc.clientSecret.existingSecret are required when auth.enabled without a bundled provider (auth.dex.enabled or auth.keycloak.enabled)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $full }}-auth
  labels:
    {{- include "topology.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth
type: Opaque
data:
  # oauth2-proxy's session-cookie key: exactly 32 bytes, which selects AES-256.
  cookie-secret: {{ $cookie | b64enc | quote }}
  {{- if $bundled }}
  client-secret: {{ $clientSecret | b64enc | quote }}
  demo-password: {{ $password | b64enc | quote }}
  {{- end }}
  {{- if .Values.auth.dex.enabled }}
  demo-password-hash: {{ $hash | b64enc | quote }}
  {{- end }}
{{- if .Values.auth.dex.enabled }}
{{- $externalUrl := trimSuffix "/" .Values.auth.externalUrl }}
---
# Dex reads its configuration from this Secret (dex.configSecret.name), not from values.
apiVersion: v1
kind: Secret
metadata:
  name: topology-dex-config
  labels:
    {{- include "topology.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth
type: Opaque
stringData:
  config.yaml: |
    # Served under /dex through the frontend, so the demo keeps one port-forward.
    issuer: {{ printf "%s/dex" $externalUrl | quote }}
    storage:
      type: memory
    web:
      https: 0.0.0.0:5554
      tlsCert: /etc/dex/tls/tls.crt
      tlsKey: /etc/dex/tls/tls.key
      tlsMinVersion: "1.3"
    oauth2:
      skipApprovalScreen: true
      responseTypes: ["code"]
      {{- if .Values.auth.cli.enabled }}
      # Only the two grants in use (ADR-015 D-15.10). Enforced at /token only: Dex serves its
      # device paths regardless, so nginx answers 404 for /dex/device*.
      grantTypes: ["authorization_code", "refresh_token"]
      {{- end }}
    {{- if .Values.auth.cli.enabled }}
    # A stolen ID token is good for an hour, a stolen refresh token for refreshHours. Dex-wide, so
    # browser sign-ins get 1 h ID tokens too; oauth2-proxy never re-checks a stored session's.
    # Refresh-token rotation stays on (Dex's default).
    expiry:
      idTokens: 1h
      refreshTokens:
        absoluteLifetime: {{ printf "%dh" (int .Values.auth.cli.refreshHours) | quote }}
        validIfNotUsedFor: 8h
    {{- end }}
    enablePasswordDB: true
    staticClients:
      - id: topology
        name: Runtime Topology
        secret: {{ $clientSecret | quote }}
        redirectURIs:
          - {{ printf "%s/oauth2/callback" $externalUrl | quote }}
      {{- if .Values.auth.cli.enabled }}
      # The CLI (ADR-015 D-15.7): public, so no secret, and PKCE S256 sent by the CLI. Listing
      # exact redirect URIs turns off Dex's out-of-band, device-callback and any-loopback-port
      # rules for this client; the Dex CSP's form-action names the same three origins.
      - id: {{ include "topology.cliClientId" . | quote }}
        name: Runtime Topology CLI
        public: true
        redirectURIs:
          - http://127.0.0.1:38085/callback
          - http://127.0.0.1:38086/callback
          - http://127.0.0.1:38087/callback
      {{- end }}
    staticPasswords:
      - email: {{ .Values.auth.dex.email | quote }}
        username: admin
        userID: {{ .Values.auth.dex.email | sha256sum | trunc 32 | quote }}
        hash: {{ $hash | quote }}
---
# Dex uses in-memory storage and never calls the Kubernetes API, so its pods get no token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: topology-dex
  labels:
    {{- include "topology.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth
automountServiceAccountToken: false
{{- end }}
{{- end }}
