# Phase 0 skeleton values. Images are placeholders until Phase 1 (agent) and Phase 2
# (backend/frontend) build real ones. Validated by values.schema.json — see test T-7.3.

nameOverride: ""
fullnameOverride: ""

# ── Shared identity ─────────────────────────────────────────────────────────────────────────
# Embedded in every canonical node ID (contracts/ids.md §1). Templated into BOTH the agent and
# the backend from this single value — a mismatch produces two disjoint graphs that both look
# empty, with no error anywhere (ADR-007 D-7.5).
clusterId: kind-topology

# ── Agent (DaemonSet) ───────────────────────────────────────────────────────────────────────
agent:
  enabled: true
  image:
    repository: topology-agent
    tag: dev
    pullPolicy: IfNotPresent

  # Leave empty to derive from the backend Service (see topology.backendIngestUrl).
  backendIngestUrl: ""

  flushIntervalSeconds: 10
  maxPendingBatches: 64

  # Kubernetes control-plane ports, excluded as infrastructure noise rather than topology.
  infrastructurePorts: "2379,2380,4149,6443,10248,10249,10250,10255,10256,10257,10259"

  # Raw source/destination IP logging. Off by default — ADR-001 §6 privacy constraint.
  debugRawEvents: false

  metricsPort: 9090
  healthPort: 8081

  # Privileged is required to load and attach eBPF programs on the target setup and is accepted
  # for the FYP (ADR-001 §5.7). Capability reduction is attempted only after correctness.
  privileged: true
  hostPID: true

  # The agent must run on EVERY node including the control-plane, or the three-node validation
  # in Phase 1 and Phase 5 silently under-reports.
  tolerations:
    - operator: Exists

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi   # ADR-001 §6 performance target

# ── Backend ─────────────────────────────────────────────────────────────────────────────────
backend:
  enabled: true
  replicaCount: 1     # HA is deferred (ADR-001 §13)
  image:
    repository: topology-backend
    tag: dev
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8000

  # Two months. Storage grows with DISTINCT EDGES x minutes, not with traffic volume, so a busy
  # cluster with a stable topology costs no more than a quiet one. Size the database volume below
  # against this number — see docs/operator-guide.md.
  retentionHours: 1440
  graphMaxNodes: 500
  graphMaxEdges: 2000
  diffChangeThresholdPercent: 20
  corsAllowedOrigins: "http://localhost:5173,http://localhost:8080"

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    # Defence in depth behind the dropped capabilities: RuntimeDefault blocks the syscalls a
    # normal service never issues. The agent is deliberately NOT given this — see agent.securityContext.
    seccompProfile:
      type: RuntimeDefault

# ── Frontend ────────────────────────────────────────────────────────────────────────────────
frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: topology-frontend
    tag: dev
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP   # Default access for kind is port-forwarding (ADR-001 §6)
    port: 8080

  # Deep links from the details panel into the cluster's own Grafana (ADR-012). Navigation only:
  # nothing is embedded, queried or installed. Rendered into /config.json for the browser; with an
  # empty url the panel shows no Grafana section at all.
  grafana:
    url: ""
    # The "Metrics" button opens this dashboard with var-namespace, var-type and var-workload.
    # The default is the workload dashboard THIS chart ships (dashboards/topology-workload.json,
    # ADR-013 D-13.3), which reaches any Grafana through the same sidecar ConfigMap as the
    # pipeline dashboard. On kube-prometheus-stack its "Kubernetes / Compute Resources / Workload"
    # (a164a7f0339f99e89cea5cb47e9be617) is a richer alternative; any dashboard using those three
    # variable names works.
    workloadDashboardUid: topology-workload
    # The "Logs" button opens Explore on this Loki datasource. Empty means no Logs button.
    lokiDatasourceUid: ""

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    # Without this the container lands in gid 0. Harmless given a read-only rootfs and no
    # capabilities, but "runs as root group" is not a sentence worth writing in a security review.
    runAsGroup: 10001
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault

# ── Database ────────────────────────────────────────────────────────────────────────────────
# Phase 3 deliverable. Either an in-cluster instance for the self-contained demo, or an
# external DATABASE_URL for an existing PostgreSQL (ADR-005, ADR-007 D-7.2).
postgresql:
  # `internal` deploys in-cluster; `external` uses externalDatabaseUrlSecret.
  mode: internal
  enabled: false      # Phase 3 (P3-K6) switches this on

  image:
    repository: postgres
    tag: "17-alpine"
    # Pinned by digest as well as tag (D-7.4). A tag is mutable — `postgres:17-alpine` is a
    # different image today than last month — so a tag alone cannot make a build reproducible.
    # The tag stays for readability; the digest is what actually resolves.
    # Set to "" to follow the tag instead.
    digest: "sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73"
    pullPolicy: IfNotPresent

  auth:
    database: topology
    username: topology
    # Never a real value here. Supplied via --set or an existing Secret; the schema rejects
    # an empty password when an in-cluster database is enabled (ADR-005 D-5.7).
    password: ""
    existingSecret: ""

  persistence:
    enabled: true
    size: 2Gi
    storageClass: ""

  service:
    port: 5432

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

# Name of an existing Secret holding key `database-url`, used when postgresql.mode=external.
externalDatabaseUrlSecret: ""

# ── Monitoring (optional) ───────────────────────────────────────────────────────────────────
# ADR-011. Off by default and adds NO dependency: nothing here installs Prometheus or Grafana.
# Both components already serve /metrics; when this is enabled the chart emits the declarations an
# EXISTING Prometheus Operator and Grafana dashboard sidecar (the kube-prometheus-stack shape)
# discover on their own — a PodMonitor for the agent, a ServiceMonitor for the backend, and one
# dashboard ConfigMap. If the CRDs are absent the install fails with an explicit "no matches for
# kind PodMonitor", which is the intended message rather than a scrape that silently never happens.
monitoring:
  enabled: false
  scrapeInterval: 30s

  # Labels the Prometheus Operator's monitor selector expects. kube-prometheus-stack selects on
  # `release: <its release name>` unless told otherwise; a monitor that renders but is never
  # selected fails exactly as silently as no monitor at all.
  monitorLabels: {}

  # Where Prometheus scrapes from. Used only when networkPolicy.enabled is also on: the backend
  # policy admits scrapes from this namespace and nowhere else (D-11.5). Optionally narrowed to
  # specific pods, e.g. {app.kubernetes.io/name: prometheus}; empty admits the whole namespace.
  prometheusNamespace: monitoring
  prometheusPodSelector: {}

  dashboard:
    enabled: true
    # The sidecar's discovery label; these are the kube-prometheus-stack defaults.
    sidecarLabel: grafana_dashboard
    sidecarLabelValue: "1"
    # Where the ConfigMap lands. Empty is the release namespace, which the sidecar finds when it
    # searches all namespaces (the kube-prometheus-stack default). Set to Grafana's own namespace
    # if yours searches only that one.
    namespace: ""
    # Grafana folder to file the dashboards under; empty leaves them at the top level.
    folder: ""

# ── Bundled observability (optional) ────────────────────────────────────────────────────────
# ADR-013. ONE flag installs Prometheus (+ kube-state-metrics) and Grafana alongside the release,
# for a cluster that has neither — the kind demo above all. Off by default: ADR-001 §4.2 keeps
# Prometheus optional, and the default render is unchanged.
#
# This is the counterpart of `monitoring` above, not a companion: `monitoring` hands the metrics
# to an EXISTING Prometheus Operator through CRDs, this one brings a plain Prometheus that
# discovers targets by annotation. The schema refuses both at once — a PodMonitor on a cluster
# without the CRD fails the install.
#
# What it does NOT decide is how your browser reaches Grafana; set frontend.grafana.url for the
# panel's buttons (`make demo-observability` sets it to the port-forward).
observability:
  enabled: false

# Values passed to the two subcharts when observability.enabled. Every image is pinned by digest
# (ADR-007 D-7.4, verified by `make verify-pinning`): bump the tag AND the digest together.
prometheus:
  # No consumer for either, and node-exporter would be a second host-mounted DaemonSet for a
  # feature that does not need one.
  alertmanager:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  kube-state-metrics:
    enabled: true
    image:
      tag: v2.20.0
      # This chart appends the value verbatim after "@", so the prefix is part of the value —
      # unlike grafana's `sha`, which adds it. verify-pinning catches either being wrong.
      sha: "sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b"
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        memory: 128Mi
  configmapReload:
    prometheus:
      image:
        tag: v0.94.0
        digest: "sha256:142a1f11df8dd165f00375b0b1826aecb9c9adeb05c39855893138d7c7575ff7"
  server:
    image:
      tag: v3.14.0
      digest: "sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0"
    # Two days: a demo Prometheus, not the topology history (that is PostgreSQL, retentionHours).
    retention: 2d
    persistentVolume:
      enabled: false
    global:
      scrape_interval: 30s
      evaluation_interval: 30s
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 768Mi

grafana:
  image:
    tag: "12.3.1"
    sha: "2175aaa91c96733d86d31cf270d5310b278654b03f5718c59de12a865380a31f"
  # The chart's helm-test pod and the root-running chown init container: neither is wanted.
  testFramework:
    enabled: false
  initChownData:
    enabled: false
  # Every dashboard is re-provisioned from the ConfigMap, so a Grafana that forgets is correct.
  persistence:
    enabled: false
  sidecar:
    image:
      tag: 2.5.0
      sha: "a6b3f707f883108376514489a94d6629109a327b2978e1d826cd104c4ca436df"
    dashboards:
      enabled: true
      # The same label and annotation ADR-011's ConfigMap carries (monitoring.dashboard.*).
      label: grafana_dashboard
      labelValue: "1"
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          uid: prometheus
          access: proxy
          isDefault: true
          # The Prometheus subchart names its Service <release>-prometheus-server; the Grafana
          # chart runs `tpl` over this block, so the release name is resolved, not guessed.
          url: "http://{{ .Release.Name }}-prometheus-server"
  grafana.ini:
    analytics:
      check_for_updates: false
      reporting_enabled: false
    news:
      news_feed_enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 384Mi

# ── Network policy ──────────────────────────────────────────────────────────────────────────
# Shipped for correctness on real clusters. kind's default CNI does NOT enforce these —
# stated plainly in docs/limitations.md rather than implying protection that is not there.
networkPolicy:
  # ON by default, having been verified under a CNI that actually enforces (P5-K9).
  #
  # Two policies ship (D-7.4): ingest reachable only from agent and frontend pods, and PostgreSQL
  # reachable only from the backend. kind's default CNI ignores NetworkPolicy entirely, so the
  # main demo cluster could never have told us whether they work — they were validated on a
  # separate kind cluster running Calico (`kind/networkpolicy-cluster.yaml`).
  #
  # What that run established, in both directions:
  #   - every pod reached Ready with the policies enforced, so kubelet health probes are NOT
  #     dropped despite originating from the node address rather than a pod. This was the
  #     specific risk that kept the default off.
  #   - the legitimate paths still work: agent -> ingest, backend -> database, frontend -> API.
  #   - an unlabelled pod in the same namespace is BLOCKED from both 5432 and the ingest port,
  #     which is what proves enforcement is real rather than permissive.
  #
  # On a cluster whose CNI ignores NetworkPolicy these are inert, not harmful.
  enabled: true
