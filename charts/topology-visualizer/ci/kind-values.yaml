# Values for the three-node kind demo. Modest requests so the full stack fits on a laptop.
# Used by `helm lint`/`helm template` in CI (T-7.1, T-7.2) and by `make demo-up`.

clusterId: kind-topology

agent:
  image:
    tag: dev
    pullPolicy: Never      # images are side-loaded with `kind load docker-image`
  flushIntervalSeconds: 10
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 256Mi

backend:
  image:
    tag: dev
    pullPolicy: Never
  corsAllowedOrigins: "http://localhost:5173,http://localhost:8080"
  # The decoy `make demo-canary` deploys (demo/demo-canary.yaml, ADR-016). Named here from the
  # start, so the canary is armed before anything can touch it.
  canaries:
    - demo/legacy-admin
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 384Mi

frontend:
  image:
    tag: dev
    pullPolicy: Never
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi

# Enabled from Phase 3 (P3-K6). Password is supplied at install time, never committed.
postgresql:
  enabled: false
  mode: internal
  persistence:
    enabled: true
    size: 2Gi

networkPolicy:
  # Left OFF for the kind demo specifically, while the chart default is now ON.
  #
  # kind's default CNI ignores NetworkPolicy, so enabling it here would create objects that do
  # nothing and quietly suggest a protection this cluster does not provide. The policies were
  # verified for real on a Calico cluster (kind/networkpolicy-cluster.yaml) — see P5-K9.
  enabled: false

# Sign-in for the demo (ADR-017): the bundled Keycloak, reached through the same port-forward as
# the UI. The demo user's password is generated at install; `make demo-up` prints how to read it.
# Upstream providers (Google, Entra ID) need real app registrations, so none is enabled here;
# docs/operator-guide.md shows how. Dex (ADR-014 D-14.7) remains: swap the two flags to use it.
auth:
  enabled: true
  externalUrl: http://localhost:8080
  dex:
    enabled: false
  keycloak:
    enabled: true
    image:
      pullPolicy: Never    # side-loaded by `make images`
  # `kubectl topology login` through the same port-forward (ADR-015 D-15.8).
  cli:
    enabled: true
