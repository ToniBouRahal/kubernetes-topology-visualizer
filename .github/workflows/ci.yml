name: CI

# CI calls the same make targets a developer calls (ADR-008 D-8.2). A job with its own inline
# command sequence drifts from local behaviour and eventually passes something that cannot be
# reproduced locally.
#
# Toolchain versions are pinned here, in the Makefile, and in docs/prerequisites.md. All three
# must move together.
#
# Every action is pinned to a commit, with its tag as a comment (ADR-014 D-14.11). A tag can be
# moved to different code after review; a commit cannot.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.26.7"
  NODE_VERSION: "24.19.0"
  PYTHON_VERSION: "3.13"
  HELM_VERSION: "v4.2.3"

jobs:
  go:
    name: Go agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: agent/go.sum
      - name: go vet
        run: cd agent && go vet ./...
      # v7+ is required for golangci-lint v2. Action v6 only understands v1 version strings
      # and fails at "invalid version string" before it ever lints.
      - uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.12.2
          working-directory: agent
      - name: Unit tests
        run: cd agent && go test ./... -count=1

  python:
    name: Python backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Create environment
        run: cd backend && uv venv --python ${{ env.PYTHON_VERSION }} && uv pip install -e ".[dev]"
      - name: Lint
        run: |
          cd backend
          .venv/bin/python -m ruff check .
          .venv/bin/python -m ruff format --check .
      - name: Tests
        run: cd backend && .venv/bin/python -m pytest -q

  contracts:
    name: Contract drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Create environment
        run: cd backend && uv venv --python ${{ env.PYTHON_VERSION }} && uv pip install -e ".[dev]"
      # T-3.6. Without this the committed contract slowly becomes fiction while the frontend
      # and agent keep generating against it.
      - name: contracts/openapi.json matches the application
        run: backend/.venv/bin/python scripts/export_openapi.py --check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Typecheck, lint, test, build
        # No `--if-present` and no "not scaffolded yet" fallback. Both were Phase 2 scaffolding,
        # and both silently pass: renaming the `test` script would leave this job green while
        # running no tests at all (P4-T10 asks for tests RUNNING in CI, not merely invoked).
        run: |
          set -euo pipefail
          cd frontend
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build

      - name: Assert component tests actually ran
        # A test runner that matches zero files exits 0. This job's whole purpose is the tests,
        # so an empty run is a failure, not a pass.
        run: |
          set -euo pipefail
          cd frontend
          npm test -- --reporter=json --outputFile=/tmp/vitest.json >/dev/null 2>&1 || true
          count=$(python3 -c "import json;print(json.load(open('/tmp/vitest.json'))['numTotalTests'])")
          echo "frontend component tests executed: $count"
          if [ "$count" -lt 20 ]; then
            echo "FAIL: expected at least 20 component tests, ran $count"
            exit 1
          fi

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install PyYAML for manifest assertions
        run: python3 -m pip install --quiet pyyaml
      # T-7.1 – T-7.4: lint, render, least-privilege RBAC, and values.schema.json rejections.
      # `helm lint` alone would happily pass a chart with a wildcard ClusterRole.
      - name: Verify chart
        run: bash scripts/verify-chart.sh

      # P5-K10: a tag is mutable, so a build pinned only by tag is not reproducible and a scan
      # result does not describe what will actually be pulled.
      - name: Verify every third-party image is pinned by digest
        run: bash scripts/verify-image-pinning.sh

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: agent/go.sum
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Create backend environment
        run: cd backend && uv venv --python ${{ env.PYTHON_VERSION }} && uv pip install -e ".[dev]"
      # ADR-014 D-14.11: govulncheck, pip-audit, npm audit. Same target a developer runs.
      - name: make audit
        run: make audit

  images:
    name: Container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build images that exist
        run: |
          for component in agent backend frontend; do
            if [ -f "$component/Dockerfile" ]; then
              echo "::group::build $component"
              docker build -t "topology-$component:ci" "$component"
              echo "::endgroup::"
            else
              echo "$component/Dockerfile not present yet — built from its own phase"
            fi
          done
      # ADR-014 D-14.11: fail on fixable HIGH/CRITICAL; SBOMs kept with the run.
      - name: Scan images and write SBOMs
        run: bash scripts/scan-images.sh ci sbom
      - name: Upload SBOMs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-cyclonedx
          path: sbom/
          if-no-files-found: warn
