name: CI

# CI calls the same make targets a developer calls (ADR-008 D-8.2). A job with its own inline
# command sequence drifts from local behaviour and eventually passes something that cannot be
# reproduced locally.
#
# Toolchain versions are pinned here, in the Makefile, and in docs/prerequisites.md. All three
# must move together.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.26.5"
  NODE_VERSION: "24.19.0"
  PYTHON_VERSION: "3.13"
  HELM_VERSION: "v4.2.3"

jobs:
  go:
    name: Go agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: agent/go.sum
      - name: go vet
        run: cd agent && go vet ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v2.12.2
          working-directory: agent
      - name: Unit tests
        run: cd agent && go test ./... -count=1

  python:
    name: Python backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Create environment
        run: cd backend && uv venv --python ${{ env.PYTHON_VERSION }} && uv pip install -e ".[dev]"
      - name: Lint
        run: |
          cd backend
          .venv/bin/python -m ruff check .
          .venv/bin/python -m ruff format --check .
      - name: Tests
        run: cd backend && .venv/bin/python -m pytest -q

  contracts:
    name: Contract drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Create environment
        run: cd backend && uv venv --python ${{ env.PYTHON_VERSION }} && uv pip install -e ".[dev]"
      # T-3.6. Without this the committed contract slowly becomes fiction while the frontend
      # and agent keep generating against it.
      - name: contracts/openapi.json matches the application
        run: backend/.venv/bin/python scripts/export_openapi.py --check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Typecheck, lint, test, build
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend
            npm ci
            npm run typecheck --if-present
            npm run lint --if-present
            npm test --if-present
            npm run build --if-present
          else
            echo "frontend not scaffolded yet — Phase 2 (P2-F1)"
          fi

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install PyYAML for manifest assertions
        run: python3 -m pip install --quiet pyyaml
      # T-7.1 – T-7.4: lint, render, least-privilege RBAC, and values.schema.json rejections.
      # `helm lint` alone would happily pass a chart with a wildcard ClusterRole.
      - name: Verify chart
        run: bash scripts/verify-chart.sh

  images:
    name: Container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build images that exist
        run: |
          for component in agent backend frontend; do
            if [ -f "$component/Dockerfile" ]; then
              echo "::group::build $component"
              docker build -t "topology-$component:ci" "$component"
              echo "::endgroup::"
            else
              echo "$component/Dockerfile not present yet — built from its own phase"
            fi
          done
